{% extends "base.html" %}
{% block title %}404 Not Found{% endblock %}
{% block page_title %}Resource Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 text-center">
    <div class="p-5 cyber-card">
      <i class="bi bi-shield-slash text-danger display-1 mb-3"></i>
      <h2 class="fw-bold text-white mb-2">404 - Page Not Found</h2>
      <p class="text-muted mb-4">The requested laboratory module or security endpoint does not exist.</p>
      <a href="{{ url_for('main.dashboard') }}" class="btn btn-cyber-primary">
        <i class="bi bi-house me-1"></i> Return to Dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}
